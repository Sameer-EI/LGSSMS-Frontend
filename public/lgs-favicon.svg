<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="32" height="32" role="img" aria-label="LGS favicon">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6A1B9A" />
      <stop offset="1" stop-color="#5E35B1" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>
  </defs>

  <!-- Purple circular background -->
  <circle cx="512" cy="512" r="500" fill="url(#g)" />

  <!-- Slight subtle darker rim -->
  <circle cx="512" cy="512" r="500" fill="none" stroke="#4527A0" stroke-opacity="0.12" stroke-width="10" />

  <!-- White LGS text, centered -->
  <text x="50%" y="56%" text-anchor="middle" fill="#fff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="420" letter-spacing="10">LGS</text>

  <!-- Make edges crisper on small sizes -->
  <rect x="0" y="0" width="1024" height="1024" fill="none" />
</svg>
